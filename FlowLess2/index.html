<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flow Less — monitoring bloods without the paperwork</title>
    <meta name="description" content="Prototype: a patient takes an opaque code to any collection unit; the sample carries it to the lab; the result routes itself home. Fictional data only." />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23005eb8'/><path d='M10 9h12v3.5h-8v3h7v3.5h-7V23h-4z' fill='white'/></svg>"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <div id="app"></div>
    <div class="toast-stack" id="toasts" aria-live="polite" aria-atomic="true"></div>

    <!--
      Plain scripts, not ES modules, and no bundler. That is deliberate: modules
      are blocked by CORS when a page is opened from file://, and this demo has
      to survive being double-clicked off a laptop with no server and no WiFi.
      Load order matters — domain before data, data before store, store before UI.
    -->
    <script src="js/lib/qrcode.js"></script>
    <script src="js/lib/code39.js"></script>

    <script src="js/domain/types.js"></script>
    <script src="js/domain/workflow.js"></script>
    <script src="js/domain/tokens.js"></script>
    <script src="js/domain/recurrence.js"></script>
    <script src="js/domain/routing.js"></script>

    <script src="js/data/testPanels.js"></script>
    <script src="js/data/odsDirectory.js"></script>
    <script src="js/data/demoPlans.js"></script>

    <script src="js/store/requestStore.js"></script>

    <script src="js/ui/dom.js"></script>
    <script src="js/ui/route.js"></script>
    <script src="js/ui/components.js"></script>
    <script src="js/ui/consoleView.js"></script>
    <script src="js/ui/newRequestForm.js"></script>
    <script src="js/ui/providerView.js"></script>
    <script src="js/ui/labView.js"></script>
    <script src="js/ui/nhsAppMock.js"></script>
    <script src="js/ui/printViews.js"></script>

    <script src="js/app.js"></script>
  </body>
</html>
